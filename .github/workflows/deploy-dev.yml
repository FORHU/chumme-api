name: Deploy Dev

# FORHU/chumme-api → the shared dev host (ap-southeast-1).
#
# One EC2 instance runs every project's dev environment. This workflow owns
# only its own container; it cannot touch another project's, and the deploy
# role cannot reach any host but this one.
#
# BEFORE THE FIRST RUN
#   1. Repository variable:
#        AWS_DEV_DEPLOY_ROLE_ARN = arn:aws:iam::617163942417:role/forhu-deploy
#      A new name on purpose: AWS_DEPLOY_ROLE_ARN already points at production
#      in several repos, and in gate-closes-api it switches the deploy target.
#   2. Check APP_PORT against this repo's Dockerfile — it is the port the
#      process listens on inside the container. HOST_PORT is allocated per
#      project and must not change; see /etc/caddy/sites/00-PORTS.md.
#   3. Put this project's own secrets in the `dev` environment, and list them
#      in the "Publish project env" step. DATABASE_URL and REDIS_URL come
#      from the host — do NOT set them here. The four *_QUEUE_URL values are
#      the dev SQS queues DevOps created; set them as `dev` variables.
#   4. Delete these from the environment; they belong to the old box's SSH
#      deploy and nothing here reads them:
#        EC2_HOST  EC2_SSH_KEY  EC2_USER  EC2_INSTANCE_ID
#        RABBITMQ_DEFAULT_USER  RABBITMQ_DEFAULT_PASS  DATABASE_URL
#        RABBITMQ_EXCHANGE  RABBITMQ_QUEUE_PREFIX  INGESTION_QUEUE_NAME
#      (job queues moved from RabbitMQ to SQS; nothing reads RABBITMQ_* now)
#      And delete APP_AWS_ACCESS_KEY_ID / APP_AWS_SECRET_ACCESS_KEY, which were
#      stored as VARIABLES — plain text, visible in logs and to anyone with read
#      access. That key pair should be rotated, not merely moved: on this host
#      the container inherits the instance role, which already covers S3 and SQS
#      on dev-*, so it needs no static credentials at all.

on:
  # Dev tracks main. Without this the dev container only changes when somebody
  # remembers to dispatch, and it silently falls behind: on 2026-10-16 ilovelawyer
  # dev was 24h and several merges stale while production deployed on every merge,
  # which read as "changes not propagating" rather than as a missing trigger.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: true
        default: main

concurrency:
  group: forhu-dev-chumme
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-0f95a93145ea25e7a
  ECR_REPOSITORY: chumme-api
  CONTAINER: chumme-api
  NETWORK: forhu-dev
  HOST_PORT: "4050"
  APP_PORT: "3002"
  ENV_PARAM: /forhu-dev/chumme-api/env
  SHARED_ENV: /opt/forhu-dev/credentials/chumme.env
  MERGED_ENV: /opt/forhu-dev/chumme-api.env

jobs:
  deploy:
    name: Build and deploy (chumme dev)
    # Native arm64: the host is Graviton. An image built on ubuntu-latest is
    # amd64, pulls cleanly, then dies with "exec format error". Do not
    # cross-build under QEMU — Node and Prisma builds take hours and look hung.
    runs-on: ubuntu-24.04-arm
    # `dev`, not `staging` — chumme's secrets live in dev and staging is empty.
    # The name has to match exactly: naming one that does not exist does not
    # fail. GitHub creates an empty environment and every secret resolves to a
    # blank string, which surfaces later as a missing-variable crash rather than
    # as a configuration error.
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          # dev- prefix so a dev image can never be mistaken for, or overwrite,
          # a production tag in the same ECR repository.
          echo "tag=dev-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # chumme's own config and secrets. DATABASE_URL and REDIS_HOST/PORT are
      # deliberately absent: the host supplies them from
      # /opt/forhu-dev/credentials/chumme.env and they are merged in at deploy
      # time. Setting them here would override the shared values.
      #
      # Job queues are SQS (no RABBITMQ_* keys any more). The container reaches
      # them on the instance role, so only the queue URLs are needed here.
      #
      # Anything unset is omitted rather than written empty: an empty value
      # reads as configured and silently disables whatever consumes it.
      - name: Publish project env to Parameter Store
        env:
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          ACCESS_TOKEN_EXPIRY: ${{ vars.ACCESS_TOKEN_EXPIRY || secrets.ACCESS_TOKEN_EXPIRY }}
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME || secrets.AWS_S3_BUCKET_NAME }}
          S3_CDN_URL: ${{ vars.S3_CDN_URL || secrets.S3_CDN_URL }}
          CHAT_WONDER_API_URL: ${{ vars.CHAT_WONDER_API_URL || secrets.CHAT_WONDER_API_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || secrets.CORS_ORIGINS }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          MAILER_EMAIL: ${{ vars.MAILER_EMAIL || secrets.MAILER_EMAIL }}
          MAILER_TRANSPORT_HOST: ${{ vars.MAILER_TRANSPORT_HOST || secrets.MAILER_TRANSPORT_HOST }}
          MAILER_TRANSPORT_PORT: ${{ vars.MAILER_TRANSPORT_PORT || secrets.MAILER_TRANSPORT_PORT }}
          MAILER_TRANSPORT_SECURE: ${{ vars.MAILER_TRANSPORT_SECURE || secrets.MAILER_TRANSPORT_SECURE }}
          MEDIA_PROCESSING_QUEUE_URL: ${{ vars.MEDIA_PROCESSING_QUEUE_URL }}
          AUDIO_MERGE_QUEUE_URL: ${{ vars.AUDIO_MERGE_QUEUE_URL }}
          INGESTION_JOBS_QUEUE_URL: ${{ vars.INGESTION_JOBS_QUEUE_URL }}
          INGESTION_JOBS_HIGH_QUEUE_URL: ${{ vars.INGESTION_JOBS_HIGH_QUEUE_URL }}
          REDIS_TTL_SECONDS: ${{ vars.REDIS_TTL_SECONDS || secrets.REDIS_TTL_SECONDS }}
          SPORTS_DEMO_MODE: ${{ vars.SPORTS_DEMO_MODE || secrets.SPORTS_DEMO_MODE }}
          START_WORKERS: ${{ vars.START_WORKERS || secrets.START_WORKERS }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER || secrets.TRANSLATION_PROVIDER }}
          TRANSLATION_API_URL: ${{ vars.TRANSLATION_API_URL || secrets.TRANSLATION_API_URL }}
          TZ: ${{ vars.TZ || secrets.TZ }}
        run: |
          set -euo pipefail
          umask 077

          # Only what this workflow owns is written unconditionally.
          {
            printf 'NODE_ENV=production\n'
            printf 'PORT=%s\n' "${{ env.APP_PORT }}"
            printf 'AWS_REGION=%s\n' "${{ env.AWS_REGION }}"
          } > env.tmp

          for k in ACCESS_TOKEN_SECRET REFRESH_TOKEN_SECRET MAILER_PASSWORD \
                   YOUTUBE_API_KEY GOOGLE_TRANSLATE_API_KEY \
                   ACCESS_TOKEN_EXPIRY AWS_S3_BUCKET_NAME S3_CDN_URL \
                   CHAT_WONDER_API_URL CORS_ORIGINS GOOGLE_CLIENT_ID \
                   GOOGLE_ANDROID_CLIENT_ID MAILER_EMAIL \
                   MAILER_TRANSPORT_HOST MAILER_TRANSPORT_PORT MAILER_TRANSPORT_SECURE \
                   MEDIA_PROCESSING_QUEUE_URL AUDIO_MERGE_QUEUE_URL \
                   INGESTION_JOBS_QUEUE_URL INGESTION_JOBS_HIGH_QUEUE_URL \
                   REDIS_TTL_SECONDS \
                   SPORTS_DEMO_MODE START_WORKERS TRANSLATION_PROVIDER \
                   TRANSLATION_API_URL TZ; do
            v="${!k:-}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> env.tmp; fi
          done

          echo "::notice::wrote $(grep -c . env.tmp) env keys"

          aws ssm put-parameter \
            --name "${{ env.ENV_PARAM }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            "cat ${{ env.SHARED_ENV }} > ${{ env.MERGED_ENV }}"
            "aws ssm get-parameter --name ${{ env.ENV_PARAM }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text >> ${{ env.MERGED_ENV }}"
            "chmod 600 ${{ env.MERGED_ENV }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform linux/arm64 ${IMAGE}"
            "docker run --rm --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} --entrypoint npx ${IMAGE} prisma migrate deploy"
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} -p 127.0.0.1:${{ env.HOST_PORT }}:${{ env.APP_PORT }} ${IMAGE}"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
