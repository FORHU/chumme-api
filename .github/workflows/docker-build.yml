name: Docker Build and Push to ECR

on:
    workflow_dispatch:

env:
    AWS_REGION: ap-southeast-1
    ECR_REPOSITORY: npx/chumme-api
    ECS_CLUSTER: uncommon-deer-0vc0dh
    ECS_SERVICE: uncommon-deer-0vc0dh-service
    ECS_TASK_DEFINITION: uncommon-deer-0vc0dh-task

jobs:
    docker-build-and-push:
        name: Build and Push Docker image to ECR
        runs-on: ubuntu-latest
        environment: dev

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Download task definition
              run: |
                  aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

            - name: Update task definition with Parameter Store secrets
              run: |
                  # Put all variables in Parameter Store secrets (both sensitive and non-sensitive)
                  SECRETS='[
                    {"name":"DATABASE_URL","valueFrom":"/chumme-api/DATABASE_URL"},
                    {"name":"ACCESS_TOKEN_SECRET","valueFrom":"/chumme-api/ACCESS_TOKEN_SECRET"},
                    {"name":"REFRESH_TOKEN_SECRET","valueFrom":"/chumme-api/REFRESH_TOKEN_SECRET"},
                    {"name":"ACCESS_TOKEN_EXPIRY","valueFrom":"/chumme-api/ACCESS_TOKEN_EXPIRY"},
                    {"name":"OPENAI_API_KEY","valueFrom":"/chumme-api/OPENAI_API_KEY"},
                    {"name":"MAILER_TRANSPORT_HOST","valueFrom":"/chumme-api/MAILER_TRANSPORT_HOST"},
                    {"name":"MAILER_TRANSPORT_PORT","valueFrom":"/chumme-api/MAILER_TRANSPORT_PORT"},
                    {"name":"MAILER_TRANSPORT_SECURE","valueFrom":"/chumme-api/MAILER_TRANSPORT_SECURE"},
                    {"name":"MAILER_EMAIL","valueFrom":"/chumme-api/MAILER_EMAIL"},
                    {"name":"MAILER_PASSWORD","valueFrom":"/chumme-api/MAILER_PASSWORD"},
                    {"name":"REDIS_HOST","valueFrom":"/chumme-api/REDIS_HOST"},
                    {"name":"REDIS_PORT","valueFrom":"/chumme-api/REDIS_PORT"},
                    {"name":"REDIS_PASSWORD","valueFrom":"/chumme-api/REDIS_PASSWORD"},
                    {"name":"REDIS_TTL_SECONDS","valueFrom":"/chumme-api/REDIS_TTL_SECONDS"},
                    {"name":"RABBITMQ_URL","valueFrom":"/chumme-api/RABBITMQ_URL"},
                    {"name":"NODE_ENV","value":"production"},
                    {"name":"PORT","value":"3000"}
                  ]'

                  # Update task definition with all secrets from Parameter Store
                  jq --argjson secrets "$SECRETS" '.containerDefinitions[0].secrets = $secrets | .containerDefinitions[0].environment = []' task-definition.json > temp-task-definition.json
                  mv temp-task-definition.json task-definition.json

            - name: Fill in the new image ID in the Amazon ECS task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition: task-definition.json
                  container-name: chumme-api
                  image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

            - name: Deploy Amazon ECS task definition
              uses: aws-actions/amazon-ecs-deploy-task-definition@v1
              timeout-minutes: 10
              with:
                  task-definition: ${{ steps.task-def.outputs.task-definition }}
                  service: ${{ env.ECS_SERVICE }}
                  cluster: ${{ env.ECS_CLUSTER }}
                  wait-for-service-stability: false
